# Example workflow: raw Appium test files (no conftest.py of their own)
# against a hardware-accelerated Android emulator, entirely on GitHub-hosted
# `ubuntu-latest` runners. Copy this into .github/workflows/ in the consuming
# repo and adjust paths.
#
# Kestrel doesn't provision the emulator itself — that's
# reactivecircus/android-emulator-runner's job. Once a device is reachable,
# kestrel owns everything else: installs the APK, starts its own Appium
# server, injects the driver fixture the test files use, runs them, and
# turns the JUnit output + screenshots into a report.
name: Android E2E

on:
  pull_request:

jobs:
  appium-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Kestrel
        run: npm install
        working-directory: kestrel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test-file deps (just pytest + Appium-Python-Client)
        run: pip install -r kestrel/python-harness/requirements.txt

      - name: Download APK built earlier in the pipeline
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: .

      # /dev/kvm exists on ubuntu-latest but isn't group-accessible to the
      # runner user out of the box — without this, the emulator silently
      # falls back to unaccelerated software emulation, which is slow
      # enough that adb sees "device offline" indefinitely.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's userdata partition needs headroom a stock
      # ubuntu-latest runner doesn't have free by default.
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo docker image prune --all --force

      - name: Run Appium suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          # kestrel's own locally-installed tsx, not `npx tsx` — npx can't
          # see kestrel/node_modules from the repo root and silently
          # downloads an ad-hoc copy instead, which fails to resolve the
          # .js-suffixed imports in kestrel's TypeScript source.
          script: kestrel/node_modules/.bin/tsx kestrel/src/cli.ts run --config kestrel.config.json

      - name: Upload Kestrel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-report
          path: kestrel-report/
