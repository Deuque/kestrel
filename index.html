<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kestrel dashboard</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #e9edf0;
    --border: #d7dee3;
    --text: #161a1f;
    --text-muted: #5b6670;
    --accent: #b5590d;
    --ok: #2e7d4f;
    --ok-soft: #e3f3e9;
    --bad: #b23a2e;
    --bad-soft: #fbe7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141a;
      --surface: #171c23;
      --surface-2: #1e252d;
      --border: #2b333c;
      --text: #e9edf1;
      --text-muted: #93a0ac;
      --accent: #e8912f;
      --ok: #6fcb93;
      --ok-soft: #16281d;
      --bad: #e77a6c;
      --bad-soft: #2e1917;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--text-muted); font-size: 14px; }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: calc(100vh - 90px);
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  .session-list {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
  }
  .session-item {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .session-item:hover { border-color: var(--accent); }
  .session-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .session-item .project { font-weight: 600; font-size: 13px; }
  .session-item .time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .session-item .counts { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; }
  .pill { padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.pass { background: var(--ok-soft); color: var(--ok); }
  .pill.fail { background: var(--bad-soft); color: var(--bad); }
  .detail { padding: 24px 32px; overflow-y: auto; }
  .empty { color: var(--text-muted); padding: 40px; text-align: center; }
  .totals { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
  ul.test-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li.test { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; background: var(--surface); }
  li.test.failed, li.test.error { border-color: var(--bad); background: var(--bad-soft); }
  li.test.passed { border-color: var(--ok); background: var(--ok-soft); }
  li.test.skipped { border-color: var(--border); background: var(--surface-2); }
  .test-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .test-status { font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
  .test-message { white-space: pre-wrap; font-size: 13px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 4px; margin: 8px 0 0; }
  img.screenshot { max-width: 480px; display: block; margin-top: 8px; border-radius: 4px; border: 1px solid var(--border); }
  a.footer-link { color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>kestrel dashboard</h1>
  <p>Test run history across every project that publishes here — pass/fail, failure detail, screenshots.</p>
</header>
<div class="layout">
  <nav class="session-list" id="session-list"><div class="empty">Loading…</div></nav>
  <main class="detail" id="detail"><div class="empty">Select a run on the left.</div></main>
</div>
<script>
async function main() {
  const listEl = document.getElementById('session-list');
  const detailEl = document.getElementById('detail');

  let index;
  try {
    const res = await fetch('runs/index.json', { cache: 'no-store' });
    index = await res.json();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">No runs published yet.</div>';
    return;
  }

  if (!Array.isArray(index) || index.length === 0) {
    listEl.innerHTML = '<div class="empty">No runs published yet.</div>';
    return;
  }

  listEl.innerHTML = '';
  index.forEach((run, i) => {
    const btn = document.createElement('button');
    btn.className = 'session-item';
    btn.dataset.id = run.id;
    const when = new Date(run.startedAt).toLocaleString();
    btn.innerHTML = `
      <div class="project">${escapeHtml(run.project || 'unlabeled')}</div>
      <div class="time">${when}</div>
      <div class="counts">
        <span class="pill pass">${run.passed} passed</span>
        <span class="pill fail">${run.failed + run.errored} failed</span>
      </div>`;
    btn.addEventListener('click', () => selectRun(run.id, btn));
    listEl.appendChild(btn);
    if (i === 0) selectRun(run.id, btn);
  });

  async function selectRun(id, btn) {
    document.querySelectorAll('.session-item').forEach((el) => el.classList.remove('active'));
    btn.classList.add('active');
    detailEl.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const res = await fetch(`runs/${id}.json`, { cache: 'no-store' });
      const run = await res.json();
      renderRun(run);
    } catch (e) {
      detailEl.innerHTML = '<div class="empty">Could not load this run.</div>';
    }
  }

  function renderRun(run) {
    const allTests = (run.suites || []).flatMap((s) => s.tests);
    detailEl.innerHTML = `
      <div class="totals">
        ${escapeHtml(run.project || 'unlabeled')} &middot;
        ${new Date(run.startedAt).toLocaleString()} &middot;
        ${run.passed} passed &middot; ${run.failed} failed &middot;
        ${run.skipped} skipped &middot; ${run.errored} errored
      </div>
      <ul class="test-list">${allTests.map(renderTest).join('')}</ul>
    `;
  }

  function renderTest(t) {
    return `
      <li class="test ${t.status}">
        <div class="test-head">
          <span>${escapeHtml(t.name)}</span>
          <span class="test-status">${t.status}</span>
        </div>
        ${t.message ? `<pre class="test-message">${escapeHtml(t.message)}</pre>` : ''}
        ${t.screenshot ? `<img class="screenshot" src="${t.screenshot}" alt="${escapeHtml(t.name)} screenshot">` : ''}
      </li>`;
  }

  function escapeHtml(v) {
    return String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
}
main();
</script>
</body>
</html>
