<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kestrel dashboard</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #e9edf0;
    --border: #d7dee3;
    --text: #161a1f;
    --text-muted: #5b6670;
    --accent: #b5590d;
    --ok: #2e7d4f;
    --ok-soft: #e3f3e9;
    --bad: #b23a2e;
    --bad-soft: #fbe7e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141a;
      --surface: #171c23;
      --surface-2: #1e252d;
      --border: #2b333c;
      --text: #e9edf1;
      --text-muted: #93a0ac;
      --accent: #e8912f;
      --ok: #6fcb93;
      --ok-soft: #16281d;
      --bad: #e77a6c;
      --bad-soft: #2e1917;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--text-muted); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--accent); }
  .crumb { color: var(--text-muted); font-size: 13px; }
  main { padding: 24px 32px; }
  .empty { color: var(--text-muted); padding: 40px 0; }

  /* Project list */
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .project-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
  }
  .project-card:hover { border-color: var(--accent); }
  .project-card .name { font-weight: 600; font-size: 15px; }
  .project-card .time { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .project-card .counts { margin-top: 10px; font-size: 12px; display: flex; gap: 8px; }

  /* Session (run) layout */
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .session-list { display: grid; gap: 8px; }
  .session-item {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .session-item:hover { border-color: var(--accent); }
  .session-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .session-item .time { font-size: 12px; color: var(--text-muted); }
  .session-item .counts { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; }

  .pill { padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.pass { background: var(--ok-soft); color: var(--ok); }
  .pill.fail { background: var(--bad-soft); color: var(--bad); }

  .totals { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
  ul.test-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li.test { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; background: var(--surface); }
  li.test.failed, li.test.error { border-color: var(--bad); background: var(--bad-soft); }
  li.test.passed { border-color: var(--ok); background: var(--ok-soft); }
  li.test.skipped { border-color: var(--border); background: var(--surface-2); }
  .test-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .test-status { font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
  .test-message { white-space: pre-wrap; font-size: 13px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 4px; margin: 8px 0 0; }
  img.screenshot { max-width: 480px; display: block; margin-top: 8px; border-radius: 4px; border: 1px solid var(--border); }
</style>
</head>
<body>
<header id="header">
  <h1>kestrel dashboard</h1>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const mainEl = document.getElementById('main');
const headerEl = document.getElementById('header');

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function fetchJson(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

function parseHash() {
  const parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
  return { slug: parts[0] || null, runId: parts[1] || null };
}

async function render() {
  const { slug, runId } = parseHash();
  headerEl.innerHTML = '<h1>kestrel dashboard</h1>';
  if (!slug) {
    await renderProjectList();
  } else {
    headerEl.innerHTML += `<span class="crumb">/</span><a href="#">all projects</a><span class="crumb">/</span><strong>${escapeHtml(slug)}</strong>`;
    await renderProject(slug, runId);
  }
}

async function renderProjectList() {
  let projects;
  try {
    projects = await fetchJson('projects/index.json');
  } catch (e) {
    mainEl.innerHTML = '<div class="empty">No projects have published here yet.</div>';
    return;
  }
  if (!Array.isArray(projects) || projects.length === 0) {
    mainEl.innerHTML = '<div class="empty">No projects have published here yet.</div>';
    return;
  }
  mainEl.innerHTML = `<div class="project-grid">${projects.map(projectCard).join('')}</div>`;
}

function projectCard(p) {
  const when = p.lastPublishedAt ? new Date(p.lastPublishedAt).toLocaleString() : '';
  return `
    <a class="project-card" href="#${encodeURIComponent(p.id)}">
      <div class="name">${escapeHtml(p.project || p.id)}</div>
      <div class="time">last run: ${when}</div>
      <div class="counts">
        <span class="pill pass">${p.lastPassed ?? 0} passed</span>
        <span class="pill fail">${p.lastFailed ?? 0} failed</span>
      </div>
    </a>`;
}

async function renderProject(slug, requestedRunId) {
  let index;
  try {
    index = await fetchJson(`projects/${encodeURIComponent(slug)}/runs/index.json`);
  } catch (e) {
    mainEl.innerHTML = '<div class="empty">No runs published for this project yet.</div>';
    return;
  }
  if (!Array.isArray(index) || index.length === 0) {
    mainEl.innerHTML = '<div class="empty">No runs published for this project yet.</div>';
    return;
  }

  mainEl.innerHTML = `
    <div class="layout">
      <nav class="session-list" id="session-list"></nav>
      <div id="detail"><div class="empty">Loading…</div></div>
    </div>`;
  const listEl = document.getElementById('session-list');
  const detailEl = document.getElementById('detail');

  const initialId = requestedRunId && index.some((r) => r.id === requestedRunId) ? requestedRunId : index[0].id;

  index.forEach((run) => {
    const btn = document.createElement('button');
    btn.className = 'session-item' + (run.id === initialId ? ' active' : '');
    btn.dataset.id = run.id;
    const when = new Date(run.startedAt).toLocaleString();
    btn.innerHTML = `
      <div class="time">${when}</div>
      <div class="counts">
        <span class="pill pass">${run.passed} passed</span>
        <span class="pill fail">${run.failed + run.errored} failed</span>
      </div>`;
    btn.addEventListener('click', () => {
      history.replaceState(null, '', `#${slug}/${run.id}`);
      document.querySelectorAll('.session-item').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');
      loadRun(slug, run.id, detailEl);
    });
    listEl.appendChild(btn);
  });

  loadRun(slug, initialId, detailEl);
}

async function loadRun(slug, id, detailEl) {
  detailEl.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const run = await fetchJson(`projects/${encodeURIComponent(slug)}/runs/${encodeURIComponent(id)}.json`);
    const allTests = (run.suites || []).flatMap((s) => s.tests);
    detailEl.innerHTML = `
      <div class="totals">
        ${new Date(run.startedAt).toLocaleString()} &middot;
        ${run.passed} passed &middot; ${run.failed} failed &middot;
        ${run.skipped} skipped &middot; ${run.errored} errored
      </div>
      <ul class="test-list">${allTests.map(renderTest).join('')}</ul>`;
  } catch (e) {
    detailEl.innerHTML = '<div class="empty">Could not load this run.</div>';
  }
}

function renderTest(t) {
  return `
    <li class="test ${t.status}">
      <div class="test-head">
        <span>${escapeHtml(t.name)}</span>
        <span class="test-status">${t.status}</span>
      </div>
      ${t.message ? `<pre class="test-message">${escapeHtml(t.message)}</pre>` : ''}
      ${t.screenshot ? `<img class="screenshot" src="${t.screenshot}" alt="${escapeHtml(t.name)} screenshot">` : ''}
    </li>`;
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
