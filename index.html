<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kestrel dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #e4e9ee;
    --border: #d3dbe2;
    --text: #1a2027;
    --text-muted: #5c6a78;
    --text-faint: #8894a0;
    --accent: #c2570f;
    --accent-soft: #fbe4d2;
    --ok: #1f8f5f;
    --ok-soft: #e1f5ea;
    --bad: #c8402f;
    --bad-soft: #fbe6e2;
    --skip: #6b7684;
    --skip-soft: #e7ebee;
    --pending: #2f6fb2;
    --pending-soft: #e4eefa;
    --shadow: 0 1px 2px rgba(23,32,42,0.06), 0 8px 24px -12px rgba(23,32,42,0.16);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1318;
      --surface: #171d24;
      --surface-2: #1e262e;
      --border: #2a333c;
      --text: #e8edf1;
      --text-muted: #8fa0ad;
      --text-faint: #5f6c78;
      --accent: #e2812f;
      --accent-soft: #2e2013;
      --ok: #5fd39a;
      --ok-soft: #123024;
      --bad: #ef7a68;
      --bad-soft: #341714;
      --skip: #9aa7b2;
      --skip-soft: #1c232a;
      --pending: #6ea8e0;
      --pending-soft: #16232f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  code, .mono, .tabular { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; }
  .tabular { font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- shell ---------- */
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(155deg, var(--accent), #8f3c07);
    display: grid; place-items: center;
    flex: none;
  }
  .brand-mark svg { width: 15px; height: 15px; display: block; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .crumbs { color: var(--text-faint); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .crumbs a { color: var(--text-muted); text-decoration: none; }
  .crumbs a:hover { color: var(--accent); }
  .crumbs .sep { color: var(--border); }
  .topbar-spacer { flex: 1; }
  .source-link { font-size: 12px; color: var(--text-faint); text-decoration: none; }
  .source-link:hover { color: var(--accent); }

  main { flex: 1; padding: 28px; max-width: 1240px; width: 100%; margin: 0 auto; }
  .empty { color: var(--text-faint); padding: 60px 0; text-align: center; font-size: 13px; }

  /* ---------- home / project grid ---------- */
  .home-head { margin-bottom: 20px; }
  .home-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .home-head p { margin: 4px 0 0; color: var(--text-muted); font-size: 13.5px; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .project-card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; text-decoration: none; color: inherit;
    transition: border-color .12s ease, transform .12s ease;
  }
  .project-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .project-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .project-card-name { font-weight: 600; font-size: 15px; }
  .project-card-meta { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .platform-tag {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 3px 7px;
    flex: none;
  }
  .project-card-stats { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .stat-pair { display: flex; gap: 14px; }
  .stat-pair .n { font-size: 20px; font-weight: 700; }
  .stat-pair .l { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-top: 1px; }
  .stat-pair .ok-n { color: var(--ok); }
  .stat-pair .bad-n { color: var(--bad); }
  .sparkline { flex: none; }
  .sparkline path.fill { fill: var(--accent-soft); }
  .sparkline path.line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
  .sparkline circle { fill: var(--accent); }

  /* ---------- workspace (project view) ---------- */
  .workspace { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) {
    .workspace { grid-template-columns: 1fr; }
    /* Sticky only makes sense beside a column it doesn't cover — stacked
       single-column mobile just wants a normal scrolling list above the
       detail pane, not a rail pinned over content as you scroll (WebKit
       also has known bugs with `sticky` grid children that make this worse
       than a plain reflow issue). */
    .rail { position: static; top: auto; }
    /* And a long list is its own mobile problem even without the sticky
       bug — collapse it into a native picker so only the selected run is
       ever visible; everything else lives inside the closed dropdown. */
    .rail-list { display: none; }
    .run-picker { display: block; }
  }

  .rail { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 28px; }
  .rail-list { display: flex; flex-direction: column; gap: 8px; }
  .rail-title { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 2px 2px; }
  .run-picker {
    display: none; width: 100%; font: inherit; font-size: 13px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; appearance: none;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235c6a78' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 16px;
  }
  .run-picker:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .run-row, .job-head {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; display: block;
  }
  .run-row:hover, .job-head:hover { border-color: var(--accent); }
  .run-row.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .run-row-top, .job-head-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .run-time { font-size: 12px; color: var(--text-muted); }
  .run-counts { display: flex; gap: 6px; margin-top: 7px; }

  .job { border: 1px solid var(--border); border-radius: 9px; background: var(--surface); overflow: hidden; }
  .job-head { border: none; border-radius: 0; border-bottom: 1px solid transparent; }
  .job.open .job-head { border-bottom-color: var(--border); }
  .job-chip {
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    background: var(--surface-2); color: var(--text-muted); border-radius: 5px; padding: 2px 6px;
  }
  .job-shards-label { font-size: 12px; color: var(--text-faint); margin-top: 3px; }
  .job-chevron { color: var(--text-faint); transition: transform .12s ease; flex: none; }
  .job.open .job-chevron { transform: rotate(90deg); }
  .job-shards { display: none; }
  .job.open .job-shards { display: block; }
  .shard-row {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: none; border-top: 1px solid var(--border);
    padding: 9px 12px 9px 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    position: relative;
  }
  .shard-row::before {
    content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 1px; background: var(--border);
  }
  .shard-row:last-child::before { bottom: 50%; }
  .shard-row:hover { background: var(--surface-2); }
  .shard-row.active { background: var(--accent-soft); }
  .shard-name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .shard-counts { display: flex; gap: 5px; flex: none; }

  .pill {
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.skip { background: var(--skip-soft); color: var(--skip); }
  .pill.pending { background: var(--pending-soft); color: var(--pending); display: inline-flex; align-items: center; gap: 5px; }
  .pill.stale { background: var(--skip-soft); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }

  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none;
    animation: kestrel-pulse 1.4s ease-in-out infinite;
  }
  @keyframes kestrel-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none; } }

  .running-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .running-panel .pulse-dot { width: 10px; height: 10px; color: var(--pending); }
  .running-panel.stale .pulse-dot { color: var(--text-faint); animation: none; }
  .running-panel h3 { font-size: 15px; font-weight: 600; margin-top: 4px; }
  .running-panel p { color: var(--text-muted); font-size: 13px; max-width: 420px; margin: 0; }

  /* ---------- detail pane ---------- */
  .detail-head { margin-bottom: 16px; }
  .detail-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-title h2 { font-size: 17px; font-weight: 700; }
  .detail-sub { color: var(--text-muted); font-size: 12.5px; margin-top: 3px; }
  .ci-link {
    margin-left: auto; font-size: 12px; font-weight: 600; color: var(--accent);
    text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
  }
  .ci-link:hover { border-color: var(--accent); }
  .job-context {
    margin-top: 10px; font-size: 12.5px; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .job-context strong { color: var(--text); }
  .job-context .sib {
    padding: 2px 7px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
    text-decoration: none; font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .job-context .sib.current { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .stat-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  @media (max-width: 700px) { .stat-strip { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; border-left: 3px solid var(--border); }
  .stat-tile .n { font-size: 22px; font-weight: 700; display: block; }
  .stat-tile .l { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-tile.ok { border-left-color: var(--ok); }
  .stat-tile.ok .n { color: var(--ok); }
  .stat-tile.bad { border-left-color: var(--bad); }
  .stat-tile.bad .n { color: var(--bad); }
  .stat-tile.skip { border-left-color: var(--skip); }
  .stat-tile.skip .n { color: var(--skip); }

  .filter-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    background: var(--surface); color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 12px;
  }
  .filter-btn:hover { border-color: var(--accent); }
  .filter-btn.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .filter-count { color: var(--text-faint); font-size: 12px; margin-left: auto; }

  /* ---------- test list ---------- */
  .test-list { display: flex; flex-direction: column; gap: 8px; }
  .test-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    border-left: 4px solid var(--border); overflow: hidden;
  }
  .test-card.status-failed, .test-card.status-error { border-left-color: var(--bad); }
  .test-card.status-passed { border-left-color: var(--ok); }
  .test-card.status-skipped { border-left-color: var(--skip); }

  .test-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px; padding: 10px 14px; }
  .test-card.expanded .test-row { padding-bottom: 8px; }
  .test-name { font-weight: 600; font-size: 13px; min-width: 0; }
  .test-classname { color: var(--text-faint); font-size: 11.5px; font-weight: 400; display: block; margin-top: 1px; }
  .test-time { color: var(--text-muted); font-size: 12px; }
  .thumb {
    width: 30px; height: 52px; border-radius: 5px; border: 1px solid var(--border);
    background: var(--surface-2); flex: none; overflow: hidden; cursor: zoom-in;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .test-body { padding: 0 14px 14px; display: grid; grid-template-columns: 1fr 148px; gap: 16px; }
  @media (max-width: 620px) { .test-body { grid-template-columns: 1fr; } }
  .test-message {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word;
    background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 10px 12px; margin: 0 0 10px;
    border: 1px solid var(--bad);
  }
  .test-message-neutral { background: var(--skip-soft); color: var(--text-muted); border-color: var(--border); }
  .thumb-lg { border-radius: 7px; border: 1px solid var(--border); overflow: hidden; cursor: zoom-in; background: var(--surface-2); }
  .thumb-lg img { width: 100%; display: block; }
  .thumb-caption { font-size: 11px; color: var(--text-faint); text-align: center; margin-top: 5px; }

  .network { margin-top: 4px; }
  .network-summary {
    display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 4px 0;
  }
  .network-summary::-webkit-details-marker { display: none; }
  .network-summary .arrow { transition: transform .12s ease; }
  details[open] > .network-summary .arrow { transform: rotate(90deg); }
  .network-entries { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .net-row {
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; background: var(--surface-2);
  }
  .net-row.bad { border-color: var(--bad); }
  .net-line { display: flex; align-items: center; gap: 8px; }
  .net-method {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 700; padding: 1px 5px;
    border-radius: 4px; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    flex: none;
  }
  .net-url { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .net-status { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex: none; }
  .net-status.ok { background: var(--ok-soft); color: var(--ok); }
  .net-status.bad { background: var(--bad-soft); color: var(--bad); }
  .net-status.none { background: var(--skip-soft); color: var(--skip); }
  .net-snippet {
    margin: 6px 0 0; font-family: "IBM Plex Mono", monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word;
    background: var(--surface); border-radius: 5px; padding: 7px 9px; color: var(--text-muted);
    border: 1px solid var(--border);
  }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; background: rgba(10,12,15,0.7);
    display: none; align-items: center; justify-content: center; padding: 40px; cursor: zoom-out; z-index: 20;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: var(--shadow); }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" id="brand-link">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 13.5 12 3l9 10.5-4 1.2L12 8l-5 6.7-4-1.2Z" fill="#fff"/><path d="M7 15.5 12 21l5-5.5-2.6.7L12 20l-2.4-3.8-2.6-.7Z" fill="#fff" opacity=".75"/></svg>
      </span>
      <span class="brand-name">kestrel</span>
    </a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="topbar-spacer"></div>
    <a class="source-link" href="https://github.com/Deuque/kestrel" target="_blank" rel="noopener noreferrer">Deuque/kestrel</a>
  </header>
  <main id="view"><div class="empty">Loading…</div></main>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script>
/* ============================================================
   Data — projects/index.json, projects/<slug>/runs/index.json
   and projects/<slug>/runs/<id>.json, all written by
   src/dashboard.ts. Fetched fresh on every load.
   ============================================================ */
async function fetchJson(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

/* ============================================================
   Helpers
   ============================================================ */
const view = document.getElementById('view');
const crumbsEl = document.getElementById('crumbs');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function esc(v) {
  return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(iso) {
  return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function fmtDuration(a, b) {
  const s = Math.round((new Date(b) - new Date(a)) / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}
function parseHash() {
  const parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
  return { slug: parts[0] ? decodeURIComponent(parts[0]) : null, runId: parts[1] ? decodeURIComponent(parts[1]) : null };
}

function sparkline(values) {
  const w = 84, h = 30, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const fill = `${line} L${pts[pts.length - 1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="pass-rate trend">
    <path class="fill" d="${fill}"/><path class="line" d="${line}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2"/>
  </svg>`;
}

/* ============================================================
   Router
   ============================================================ */
async function render() {
  clearTimeout(pendingPollTimer);
  const { slug, runId } = parseHash();
  if (!slug) {
    crumbsEl.innerHTML = '';
    await renderHome();
  } else {
    crumbsEl.innerHTML = `<a href="#">Projects</a><span class="sep">/</span><span id="crumb-name">${esc(slug)}</span>`;
    await renderProject(slug, runId);
  }
}

/* ============================================================
   Home — project list
   ============================================================ */
async function renderHome() {
  view.innerHTML = '<div class="empty">Loading…</div>';
  let projects;
  try {
    projects = await fetchJson('projects/index.json');
  } catch (e) {
    projects = [];
  }
  if (!Array.isArray(projects) || projects.length === 0) {
    view.innerHTML = '<div class="empty">No projects have published here yet.</div>';
    return;
  }
  view.innerHTML = `
    <div class="home-head">
      <h1>Projects</h1>
      <p>Every project publishing runs to this dashboard.</p>
    </div>
    <div class="project-grid">${projects.map(projectCard).join('')}</div>`;
}

function projectCard(p) {
  const when = p.lastPublishedAt ? fmtTime(p.lastPublishedAt) : '—';
  const spark = Array.isArray(p.trend) && p.trend.length >= 2 ? sparkline(p.trend) : '';
  return `
    <a class="project-card" href="#${encodeURIComponent(p.id)}">
      <div class="project-card-head">
        <div>
          <div class="project-card-name">${esc(p.project || p.id)}</div>
          <div class="project-card-meta">Last run ${when}</div>
        </div>
        ${p.lastPlatform ? `<span class="platform-tag">${esc(p.lastPlatform)}</span>` : ''}
      </div>
      <div class="project-card-stats">
        <div class="stat-pair">
          <div><span class="n ok-n tabular">${p.lastPassed ?? 0}</span><span class="l">Passed</span></div>
          <div><span class="n bad-n tabular">${p.lastFailed ?? 0}</span><span class="l">Failed</span></div>
        </div>
        ${spark}
      </div>
    </a>`;
}

/* ============================================================
   Project — grouped run list + detail pane
   ============================================================ */
async function renderProject(slug, requestedRunId) {
  view.innerHTML = '<div class="empty">Loading…</div>';
  let runs;
  try {
    runs = await fetchJson(`projects/${encodeURIComponent(slug)}/runs/index.json`);
  } catch (e) {
    runs = [];
  }
  if (!Array.isArray(runs) || runs.length === 0) {
    view.innerHTML = '<div class="empty">No runs published for this project yet.</div>';
    return;
  }

  const crumbName = document.getElementById('crumb-name');
  if (crumbName) crumbName.textContent = runs[0].project || slug;

  const initialId = requestedRunId && runs.some((r) => r.id === requestedRunId) ? requestedRunId : runs[0].id;

  // Group by jobId, preserving first-seen order — runs sharing a jobId
  // (several kestrel instances sharding one suite) collapse into one row.
  const groups = [];
  const byJob = new Map();
  for (const r of runs) {
    if (!r.jobId) { groups.push({ standalone: r }); continue; }
    if (!byJob.has(r.jobId)) { const g = { jobId: r.jobId, shards: [] }; byJob.set(r.jobId, g); groups.push({ job: g }); }
    byJob.get(r.jobId).shards.push(r);
  }

  view.innerHTML = `
    <div class="workspace">
      <nav class="rail">
        <select class="run-picker" id="run-picker" aria-label="Select a run">${runPickerOptions(groups, initialId)}</select>
        <div class="rail-list">
          <div class="rail-title">Runs</div>
          ${groups.map((g) => g.job ? jobHtml(g.job, initialId) : runRowHtml(g.standalone, initialId)).join('')}
        </div>
      </nav>
      <section class="detail" id="detail"><div class="empty">Loading…</div></section>
    </div>`;

  document.querySelectorAll('.job-head').forEach((el) => {
    el.addEventListener('click', () => el.closest('.job').classList.toggle('open'));
  });
  document.querySelectorAll('[data-run-id]').forEach((el) => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = el.dataset.runId;
      selectRun(slug, id);
      document.querySelectorAll('.run-row, .shard-row').forEach((x) => x.classList.remove('active'));
      el.classList.add('active');
      const picker = document.getElementById('run-picker');
      if (picker) picker.value = id;
      await loadRun(slug, id, runs);
      scrollToDetailOnMobile();
    });
  });
  document.getElementById('run-picker').addEventListener('change', async (e) => {
    const id = e.target.value;
    selectRun(slug, id);
    const rowEl = document.querySelector(`[data-run-id="${CSS.escape(id)}"]`);
    document.querySelectorAll('.run-row, .shard-row').forEach((x) => x.classList.remove('active'));
    if (rowEl) {
      rowEl.classList.add('active');
      const jobEl = rowEl.closest('.job');
      if (jobEl) jobEl.classList.add('open');
    }
    await loadRun(slug, id, runs);
    scrollToDetailOnMobile();
  });

  loadRun(slug, initialId, runs);
}

function selectRun(slug, id) {
  history.replaceState(null, '', `#${encodeURIComponent(slug)}/${encodeURIComponent(id)}`);
}

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// Stacked single-column mobile: the rail (or picker) can represent a long
// list, so jump straight to the result instead of leaving the user to
// scroll past whatever they just picked.
function scrollToDetailOnMobile() {
  if (window.matchMedia('(max-width: 860px)').matches) {
    document.getElementById('detail').scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }
}

function pickerLabel(r) {
  const when = fmtTime(r.startedAt);
  if (r.status === 'pending') return `${when} — ${isStale(r) ? 'not reporting' : `running ${elapsedSince(r.startedAt)}`}`;
  return `${when} — ${r.passed} passed, ${r.failed + r.errored} failed${r.skipped ? `, ${r.skipped} skipped` : ''}`;
}

// Mirrors the job/run rows in the rail as <option>s so mobile gets a native,
// closed-by-default picker instead of a long list to scroll through —
// only the selected run's own label is ever visible until it's reopened.
function runPickerOptions(groups, activeId) {
  return groups
    .map((g) => {
      if (g.job) {
        const opts = g.job.shards
          .map((r) => `<option value="${esc(r.id)}"${r.id === activeId ? ' selected' : ''}>${esc(r.shard)} — ${esc(pickerLabel(r))}</option>`)
          .join('');
        return `<optgroup label="Job ${esc(g.job.jobId)} (${g.job.shards.length} shard${g.job.shards.length === 1 ? '' : 's'})">${opts}</optgroup>`;
      }
      const r = g.standalone;
      return `<option value="${esc(r.id)}"${r.id === activeId ? ' selected' : ''}>${esc(pickerLabel(r))}</option>`;
    })
    .join('');
}

const STALE_MS = 60 * 60 * 1000; // a pending run older than this may have been cancelled — kestrel has no way to know for sure

function elapsedSince(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function isStale(r) {
  return r.status === 'pending' && Date.now() - new Date(r.startedAt).getTime() > STALE_MS;
}

function countsPill(r) {
  return `<span class="pill ok tabular">${r.passed} pass</span><span class="pill bad tabular">${r.failed + r.errored} fail</span>${r.skipped ? `<span class="pill skip tabular">${r.skipped} skip</span>` : ''}`;
}

// Pending/stale rows show a running indicator instead of pass/fail counts —
// there's nothing to count yet.
function statusBadge(r) {
  if (r.status !== 'pending') return countsPill(r);
  if (isStale(r)) return `<span class="pill stale" title="No update in over an hour — kestrel can't tell if this was cancelled">Not reporting</span>`;
  return `<span class="pill pending"><span class="pulse-dot"></span>Running ${elapsedSince(r.startedAt)}</span>`;
}

function jobHtml(job, activeId) {
  const totals = job.shards.reduce((a, r) => ({ passed: a.passed + r.passed, failed: a.failed + r.failed, errored: a.errored + r.errored, skipped: a.skipped + r.skipped }), { passed: 0, failed: 0, errored: 0, skipped: 0 });
  const runningCount = job.shards.filter((r) => r.status === 'pending' && !isStale(r)).length;
  const isOpen = job.shards.some((r) => r.id === activeId);
  return `
    <div class="job${isOpen ? ' open' : ''}">
      <div class="job-head">
        <div class="job-head-top">
          <span class="job-chip">Job</span>
          <span class="run-time" style="flex:1">${fmtTime(job.shards[0].startedAt)}</span>
          <svg class="job-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="job-shards-label" title="${esc(job.jobId)}">${esc(job.jobId)} · ${job.shards.length} shard${job.shards.length === 1 ? '' : 's'}</div>
        <div class="run-counts">${countsPill(totals)}${runningCount ? `<span class="pill pending"><span class="pulse-dot"></span>${runningCount} running</span>` : ''}</div>
      </div>
      <div class="job-shards">
        ${job.shards.map((r) => `
          <div class="shard-row${r.id === activeId ? ' active' : ''}" data-run-id="${esc(r.id)}">
            <span class="shard-name" title="${esc(r.shard)}">${esc(r.shard)}</span>
            <span class="shard-counts">${statusBadge(r)}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function runRowHtml(r, activeId) {
  return `
    <div class="run-row${r.id === activeId ? ' active' : ''}" data-run-id="${esc(r.id)}">
      <div class="run-row-top">
        <span class="run-time">${fmtTime(r.startedAt)}</span>
      </div>
      <div class="run-counts">${statusBadge(r)}</div>
    </div>`;
}

/* ============================================================
   Run detail
   ============================================================ */
let currentFilter = 'all';
let pendingPollTimer = null;

// Static site, no push updates — while a run is still pending, poll its
// lightweight index entry every 20s. A still-pending result just refreshes
// the "started Xm ago" text; a finished one triggers a full re-render so
// the rail's counts catch up too.
function schedulePendingPoll(slug, id) {
  clearTimeout(pendingPollTimer);
  pendingPollTimer = setTimeout(async () => {
    let runs;
    try {
      runs = await fetchJson(`projects/${encodeURIComponent(slug)}/runs/index.json`);
    } catch (e) {
      schedulePendingPoll(slug, id);
      return;
    }
    const meta = runs.find((r) => r.id === id);
    if (meta && meta.status === 'pending') {
      loadRun(slug, id, runs);
    } else {
      renderProject(slug, id);
    }
  }, 20000);
}

async function loadRun(slug, id, runs) {
  clearTimeout(pendingPollTimer);
  const meta = runs.find((r) => r.id === id);
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty">Loading…</div>';

  let run;
  try {
    run = await fetchJson(`projects/${encodeURIComponent(slug)}/runs/${encodeURIComponent(id)}.json`);
  } catch (e) {
    detail.innerHTML = '<div class="empty">Could not load this run.</div>';
    return;
  }

  const allTests = (run.suites || []).flatMap((s) => s.tests.map((t) => ({ ...t, suite: s.name })));
  currentFilter = 'all';

  const jobSiblings = meta.jobId ? runs.filter((r) => r.jobId === meta.jobId) : null;
  const pending = meta.status === 'pending';
  const stale = pending && isStale(meta);

  const header = `
    <div class="detail-head">
      <div class="detail-title">
        <h2>${meta.jobId ? esc(meta.shard) : 'Run detail'}</h2>
        <span class="platform-tag">${esc(run.platform)}</span>
        ${run.ciRunUrl ? `<a class="ci-link" href="${esc(run.ciRunUrl)}" target="_blank" rel="noopener noreferrer">View / re-run in GitHub Actions →</a>` : ''}
      </div>
      <div class="detail-sub">${pending ? `started ${fmtTime(meta.startedAt)}` : `${fmtTime(meta.startedAt)} · ran ${fmtDuration(run.startedAt, run.finishedAt)}`}</div>
      ${jobSiblings ? `
        <div class="job-context">
          <span>Part of job <strong class="mono">${esc(meta.jobId)}</strong>:</span>
          ${jobSiblings.map((s) => `<a class="sib${s.id === id ? ' current' : ''}" href="#${encodeURIComponent(slug)}/${encodeURIComponent(s.id)}" title="${esc(s.shard)}">${esc(s.shard)}</a>`).join('')}
        </div>` : ''}
    </div>`;

  if (pending) {
    detail.innerHTML = header + `
      <div class="running-panel${stale ? ' stale' : ''}">
        <span class="pulse-dot"></span>
        <h3>${stale ? "Hasn't reported in a while" : 'Still running…'}</h3>
        <p>${stale
          ? `No update in over an hour (started ${elapsedSince(meta.startedAt)} ago) — kestrel can't tell whether this was cancelled. ${run.ciRunUrl ? 'Check GitHub Actions for the actual status.' : ''}`
          : `Started ${elapsedSince(meta.startedAt)} ago. Results will appear here once the run finishes${run.ciRunUrl ? ' — or follow along live in GitHub Actions.' : '.'}`}</p>
      </div>`;
    schedulePendingPoll(slug, id);
    return;
  }

  detail.innerHTML = header + `
    <div class="stat-strip">
      <div class="stat-tile ok"><span class="n tabular">${meta.passed}</span><span class="l">Passed</span></div>
      <div class="stat-tile bad"><span class="n tabular">${meta.failed}</span><span class="l">Failed</span></div>
      <div class="stat-tile bad"><span class="n tabular">${meta.errored}</span><span class="l">Errored</span></div>
      <div class="stat-tile skip"><span class="n tabular">${meta.skipped}</span><span class="l">Skipped</span></div>
      <div class="stat-tile"><span class="n tabular">${fmtDuration(run.startedAt, run.finishedAt)}</span><span class="l">Duration</span></div>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="test-list" id="test-list"></div>`;

  const counts = {
    all: allTests.length,
    failed: allTests.filter((t) => t.status === 'failed' || t.status === 'error').length,
    passed: allTests.filter((t) => t.status === 'passed').length,
    skipped: allTests.filter((t) => t.status === 'skipped').length,
  };
  const filters = [['all', 'All'], ['failed', 'Failed'], ['passed', 'Passed'], ['skipped', 'Skipped']];
  const filterBar = document.getElementById('filter-bar');
  filterBar.innerHTML = filters.map(([key, label]) =>
    `<button class="filter-btn${key === currentFilter ? ' active' : ''}" data-filter="${key}">${label} <span class="tabular">${counts[key]}</span></button>`
  ).join('') + `<span class="filter-count">${allTests.length} tests</span>`;

  filterBar.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      filterBar.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      paintTests(allTests);
    });
  });

  paintTests(allTests);
}

function paintTests(allTests) {
  const list = document.getElementById('test-list');
  const filtered = allTests.filter((t) => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'failed') return t.status === 'failed' || t.status === 'error';
    return t.status === currentFilter;
  });
  list.innerHTML = filtered.map(testCardHtml).join('') || '<div class="empty">No tests match this filter.</div>';
  list.querySelectorAll('.thumb, .thumb-lg').forEach((el) => {
    el.addEventListener('click', () => {
      const src = el.querySelector('img').src;
      lightboxImg.src = src;
      lightbox.classList.add('open');
    });
  });
}

function testCardHtml(t) {
  const bad = t.status === 'failed' || t.status === 'error';
  return `
    <div class="test-card status-${t.status}${bad ? ' expanded' : ''}">
      <div class="test-row">
        <div class="test-name">${esc(t.name)}${t.classname ? `<span class="test-classname mono">${esc(t.classname)}</span>` : ''}</div>
        <span class="test-time tabular">${t.timeSeconds !== undefined && t.timeSeconds !== null ? `${t.timeSeconds}s` : ''}</span>
        <span class="pill ${t.status === 'passed' ? 'ok' : t.status === 'skipped' ? 'skip' : 'bad'}">${t.status}</span>
        ${!bad && t.screenshot ? `<div class="thumb"><img src="${t.screenshot}" alt=""></div>` : '<span></span>'}
      </div>
      ${bad ? `
        <div class="test-body">
          <div>
            ${t.message ? `<pre class="test-message">${esc(t.message)}</pre>` : ''}
            ${renderNetwork(t.networkLogs)}
          </div>
          ${t.screenshot ? `<div><div class="thumb-lg"><img src="${t.screenshot}" alt=""></div><div class="thumb-caption">on-failure screenshot</div></div>` : ''}
        </div>` : (t.status === 'skipped' && t.message ? `<div class="test-body" style="grid-template-columns:1fr"><pre class="test-message test-message-neutral">${esc(t.message)}</pre></div>` : '')}
    </div>`;
}

function renderNetwork(entries) {
  if (!entries || entries.length === 0) return '';
  const failedCount = entries.filter((e) => (e.statusCode !== undefined && e.statusCode !== null && e.statusCode >= 400) || (e.snippet && (e.statusCode === undefined || e.statusCode === null))).length;
  return `
    <details class="network">
      <summary class="network-summary"><svg class="arrow" width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Network — ${entries.length} call${entries.length === 1 ? '' : 's'}${failedCount ? `, ${failedCount} failed` : ''}</summary>
      <div class="network-entries">
        ${entries.map((e) => {
          const hasStatus = e.statusCode !== undefined && e.statusCode !== null;
          const isBad = (hasStatus && e.statusCode >= 400) || (!hasStatus && e.snippet);
          const statusClass = !hasStatus ? (e.snippet ? 'bad' : 'none') : (isBad ? 'bad' : 'ok');
          const statusLabel = hasStatus ? e.statusCode : (e.snippet ? 'no response' : '—');
          return `
            <div class="net-row${isBad ? ' bad' : ''}">
              <div class="net-line">
                <span class="net-method">${esc(e.method || '?')}</span>
                <span class="net-url" title="${esc(e.url)}">${esc(e.url)}</span>
                <span class="net-status ${statusClass}">${esc(statusLabel)}</span>
              </div>
              ${e.snippet ? `<pre class="net-snippet">${esc(e.snippet)}</pre>` : ''}
            </div>`;
        }).join('')}
      </div>
    </details>`;
}

lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
document.getElementById('brand-link').addEventListener('click', () => history.replaceState(null, '', '#'));
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
